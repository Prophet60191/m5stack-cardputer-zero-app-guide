name: Guide and offline preflight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CardputerZero/packages
          ref: 3ed6a232372bdc769826d93aba03fb9b6bbd9589
          path: build/store-packages
          persist-credentials: false
      - name: Test documentation and non-publishing checks
        env:
          CZ_STORE_PACKAGES: ${{ github.workspace }}/build/store-packages
          PYTHONDONTWRITEBYTECODE: 1
        run: python3 -m unittest discover -s tests -v
