name: Guide and offline preflight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CardputerZero/packages
          ref: b6c559a0448aae7715c4b45678a0b89c9eceb12b
          path: build/store-packages
          persist-credentials: false
      - name: Test documentation and non-publishing checks
        env:
          CZ_STORE_PACKAGES: ${{ github.workspace }}/build/store-packages
          PYTHONDONTWRITEBYTECODE: 1
        run: python3 -m unittest discover -s tests -v
